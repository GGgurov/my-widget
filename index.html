<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Unbounded', sans-serif;
  background: #09090f;
  color: #fff;
  width: 100%;
  min-height: 500px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.topbar {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}
.cat-pill {
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 700;
  color: #09090f;
  background: #ffdd00;
  padding: 5px 14px;
  border-radius: 30px;
}
.idx-label {
  font-size: 9px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
}

.big-text {
  font-size: clamp(18px, 3vw, 26px);
  font-weight: 900;
  line-height: 1.45;
  min-height: 120px;
  display: flex;
  align-items: center;
  transition: opacity 0.25s, transform 0.25s;
  color: #fff;
}
.big-text.hide { opacity: 0; transform: translateY(8px); }

.bar-wrap {
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.bar {
  height: 100%;
  background: #ffdd00;
  transform-origin: left;
  border-radius: 2px;
}

.btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 18px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-family: 'Unbounded', sans-serif;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1px;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.12); }
.btn.on { background: #ffdd00; color: #09090f; border-color: #ffdd00; }
.btn-next { background: #ffdd00; color: #09090f; border-color: #ffdd00; flex: 1; }
.btn-next:hover { background: #ffe82e; }

.timer-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tbtn {
  padding: 7px 14px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-family: 'Unbounded', sans-serif;
  font-size: 8px;
  letter-spacing: 1px;
  border-radius: 10px;
  cursor: pointer;
}
.tbtn.on { border-color: #ffdd00; color: #ffdd00; }

.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.fbtn {
  padding: 5px 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: rgba(255,255,255,0.4);
  font-family: 'Unbounded', sans-serif;
  font-size: 7px;
  letter-spacing: 1px;
  border-radius: 20px;
  cursor: pointer;
}
.fbtn.on { border-color: rgba(255,221,0,0.5); color: #ffdd00; background: rgba(255,221,0,0.08); }

.info-bar {
  font-size: 8px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 1px;
  text-align: center;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="cat-pill" id="cat">...</div>
  <div class="idx-label" id="idx">1 / —</div>
</div>

<div class="big-text" id="txt">Загружаем темы...</div>

<div class="bar-wrap"><div class="bar" id="bar"></div></div>

<div class="btns">
  <button class="btn on" id="btnAuto" onclick="toggleAuto()">⏸ АВТО</button>
  <button class="btn btn-next" onclick="next()">→ СЛЕДУЮЩАЯ</button>
</div>

<div class="timer-row">
  <span style="font-size:8px;color:rgba(255,255,255,0.3);align-self:center;letter-spacing:1px">ТЕМП:</span>
  <button class="tbtn" onclick="setDur(20000,this)">20с</button>
  <button class="tbtn on" onclick="setDur(35000,this)">35с</button>
  <button class="tbtn" onclick="setDur(60000,this)">1мин</button>
  <button class="tbtn" onclick="setDur(90000,this)">1.5мин</button>
</div>

<div class="filter-row" id="filterRow"></div>

<div class="info-bar" id="infobar">150 тем · перемешаны случайно</div>

let pool = [...ALL].sort(() => Math.random() - 0.5);
let idx = 0;
let dur = 35000;
let auto = true;
let timer = null;
let activeFilter = null;

const cats = [...new Set(ALL.map(p => p.c))];

const txtEl = document.getElementById('txt');
const catEl = document.getElementById('cat');
const idxEl = document.getElementById('idx');
const barEl = document.getElementById('bar');
const btnAuto = document.getElementById('btnAuto');
const infoEl = document.getElementById('infobar');
const filterRow = document.getElementById('filterRow');

function buildFilters() {
  const allBtn = document.createElement('button');
  allBtn.className = 'fbtn on';
  allBtn.textContent = 'ВСЕ';
  allBtn.onclick = () => setFilter(null, allBtn);
  filterRow.appendChild(allBtn);
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'fbtn';
    b.textContent = c.toUpperCase();
    b.onclick = () => setFilter(c, b);
    filterRow.appendChild(b);
  });
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  pool = (cat ? ALL.filter(p => p.c === cat) : [...ALL]).sort(() => Math.random() - 0.5);
  idx = 0;
  show(0);
}

function getItem(i) { return pool[i % pool.length]; }

function show(i) {
  txtEl.classList.add('hide');
  setTimeout(() => {
    const p = getItem(i);
    catEl.textContent = p.c;
    txtEl.textContent = p.t;
    idxEl.textContent = (i % pool.length + 1) + ' / ' + pool.length;
    infoEl.textContent = pool.length + ' тем' + (activeFilter ? ' · ' + activeFilter : ' · все категории');
    txtEl.classList.remove('hide');
    startBar();
  }, 250);
}

function startBar() {
  barEl.style.transition = 'none';
  barEl.style.transform = 'scaleX(1)';
  void barEl.offsetWidth;
  if (auto) {
    barEl.style.transition = `transform ${dur/1000}s linear`;
    barEl.style.transform = 'scaleX(0)';
  } else {
    barEl.style.transform = 'scaleX(0)';
  }
}

function next() {
  idx++;
  show(idx);
  if (auto) { clearInterval(timer); timer = setInterval(tick, dur); }
}

function tick() { idx++; show(idx); }

function toggleAuto() {
  auto = !auto;
  if (auto) {
    btnAuto.textContent = '⏸ АВТО';
    btnAuto.classList.add('on');
    timer = setInterval(tick, dur);
    startBar();
  } else {
    btnAuto.textContent = '▶ АВТО';
    btnAuto.classList.remove('on');
    clearInterval(timer);
    barEl.style.transition = 'none';
    barEl.style.transform = 'scaleX(0)';
  }
}

function setDur(d, btn) {
  dur = d;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if (auto) { clearInterval(timer); timer = setInterval(tick, dur); startBar(); }
}

buildFilters();
show(0);
btnAuto.classList.add('on');
timer = setInterval(tick, dur);
</script>
</body>
</html>

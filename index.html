<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Stopwatch Widget Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Unbounded', sans-serif;
            transition: background-color 0.3s;
        }

        /* Эффект Liquid Glass */
        .glass-panel {
            background: rgba(20, 20, 25, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glow-text {
            text-shadow: 0px 0px 24px rgba(99, 102, 241, 0.75), 0px 0px 8px rgba(255, 255, 255, 0.3);
        }

        /* --- ПРАЗДНИЧНЫЕ АНИМАЦИИ ДЛЯ OBS (Каждые 30/60 минут) --- */
        @keyframes milestone-card-pulse {
            0%, 100% { 
                border-color: rgba(255, 255, 255, 0.08); 
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            }
            50% { 
                border-color: rgba(236, 72, 153, 0.6); 
                box-shadow: 0 0 60px 20px rgba(99, 102, 241, 0.6), inset 0 0 24px rgba(236, 72, 153, 0.4);
                transform: scale(1.02);
            }
        }

        @keyframes milestone-text-pulse {
            0%, 100% { 
                text-shadow: 0px 0px 24px rgba(99, 102, 241, 0.75), 0px 0px 8px rgba(255, 255, 255, 0.3);
                color: #818cf8; /* indigo-400 */
            }
            50% { 
                text-shadow: 0px 0px 50px rgba(236, 72, 153, 1), 0px 0px 20px rgba(255, 255, 255, 0.9);
                color: #f472b6; /* pink-400 */
                transform: scale(1.06);
            }
        }

        /* Классы активации анимации (будут навешиваться скриптом на 6 секунд) */
        .animate-milestone-card {
            animation: milestone-card-pulse 3s ease-in-out 2;
            transition: all 0.5s ease-in-out;
        }

        .animate-milestone-text {
            animation: milestone-text-pulse 3s ease-in-out 2;
            transition: all 0.5s ease-in-out;
        }

        /* Режимы отображения */
        body.widget-mode {
            background: transparent !important;
        }
        body.widget-mode #control-panel {
            display: none !important;
        }
        body.control-mode #widget-view {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

    <div id="widget-view" class="glass-panel rounded-[2rem] px-14 py-8 flex flex-col items-center justify-center text-center min-w-[360px] transition-all duration-500">
        <div id="widget-label" class="text-xs md:text-sm font-bold tracking-[0.3em] text-indigo-300/80 uppercase mb-3 select-none transition-all duration-300 whitespace-nowrap">
            ЧЕЛЛЕНДЖ НАЧАТ
        </div>
        <div id="display-widget" class="text-6xl md:text-8xl font-black text-indigo-400 glow-text tracking-wider tabular-nums select-none transition-all duration-300">
            00:00:00
        </div>
    </div>

    <div id="control-panel" class="glass-panel rounded-3xl p-8 max-w-md w-full flex flex-col gap-6 hidden">
        <div>
            <h1 class="text-2xl font-bold text-center mb-1">Таймер стрима Pro</h1>
            <p class="text-center text-xs text-gray-400">Синхронизация + Кастомный текст</p>
        </div>

        <div class="bg-black/20 rounded-2xl p-4 border border-white/5">
            <div id="control-label-preview" class="text-[10px] font-bold text-center tracking-widest text-indigo-300/60 uppercase mb-1">
                ЧЕЛЛЕНДЖ НАЧАТ
            </div>
            <div id="display-control" class="text-5xl font-black text-center text-indigo-400 glow-text tracking-wider tabular-nums">
                00:00:00
            </div>
        </div>

        <div class="flex gap-2 justify-center">
            <button id="btn-start" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg shadow-indigo-600/20 text-xs uppercase tracking-wider">Старт</button>
            <button id="btn-pause" class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 rounded-xl font-bold transition shadow-lg shadow-amber-500/20 text-xs uppercase tracking-wider">Пауза</button>
            <button id="btn-reset" class="flex-1 py-3 bg-red-500 hover:bg-red-400 rounded-xl font-bold transition shadow-lg shadow-red-500/20 text-xs uppercase tracking-wider">Сброс</button>
        </div>

        <div class="border-t border-gray-800 pt-4">
            <label class="block text-[11px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Текст над таймером (Любая надпись)</label>
            <div class="flex gap-2">
                <input type="text" id="inp-label" placeholder="Например: МАРАФОН, СТРИМ ОНЛАЙН" class="flex-1 bg-gray-900/80 rounded-xl px-4 py-2.5 border border-gray-700 focus:border-indigo-500 outline-none transition font-medium text-sm text-white">
                <button id="btn-set-label" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition text-xs uppercase tracking-wider">ОК</button>
            </div>
        </div>

        <div class="border-t border-gray-800 pt-4">
            <label class="block text-[11px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Задать время (ЧЧ : ММ : СС)</label>
            <div class="flex gap-2 items-center justify-between">
                <input type="number" id="inp-h" placeholder="00" min="0" class="w-16 bg-gray-900/80 rounded-xl text-center p-2.5 border border-gray-700 focus:border-indigo-500 outline-none transition font-bold">
                <span class="font-bold text-gray-600">:</span>
                <input type="number" id="inp-m" placeholder="00" min="0" max="59" class="w-16 bg-gray-900/80 rounded-xl text-center p-2.5 border border-gray-700 focus:border-indigo-500 outline-none transition font-bold">
                <span class="font-bold text-gray-600">:</span>
                <input type="number" id="inp-s" placeholder="00" min="0" max="59" class="w-16 bg-gray-900/80 rounded-xl text-center p-2.5 border border-gray-700 focus:border-indigo-500 outline-none transition font-bold">
                
                <button id="btn-set" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-xl font-bold transition text-xs uppercase tracking-wider">Задать</button>
            </div>
        </div>

        <div class="border-t border-gray-800 pt-4">
            <button id="btn-copy-link" class="w-full px-4 py-3 bg-emerald-500 hover:bg-emerald-400 text-gray-900 rounded-xl font-bold transition shadow-lg shadow-emerald-500/20 flex justify-center items-center gap-2 text-xs uppercase tracking-wider">
                Скопировать ссылку для OBS
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Твой конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDuxR5hsWmfIWrjgrsU4zVEnIVppUZxNNU",
            authDomain: "tt-widget-88711.firebaseapp.com",
            databaseURL: "https://tt-widget-88711-default-rtdb.firebaseio.com",
            projectId: "tt-widget-88711",
            storageBucket: "tt-widget-88711.firebasestorage.app",
            messagingSenderId: "997435022478",
            appId: "1:997435022478:web:a0ad462f2a7dd074d27ddf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const timerRef = ref(db, 'stream_stopwatch');

        // Глобальное состояние (по умолчанию добавлена надпись)
        let state = {
            isRunning: false,
            startTime: 0,
            accumulated: 0,
            labelText: "ЧЕЛЛЕНДЖ НАЧАТ"
        };

        // DOM элементы
        const displayWidget = document.getElementById('display-widget');
        const widgetLabel = document.getElementById('widget-label');
        
        const displayControl = document.getElementById('display-control');
        const controlLabelPreview = document.getElementById('control-label-preview');
        const controlPanel = document.getElementById('control-panel');
        const inpLabel = document.getElementById('inp-label');
        
        // Переменная для отслеживания секунд, чтобы анимация срабатывала строго 1 раз
        let lastTriggeredSecond = -1;

        // Определяем режим
        const urlParams = new URLSearchParams(window.location.search);
        const isWidget = urlParams.get('widget') === 'true';

        if (isWidget) {
            document.body.classList.add('widget-mode');
        } else {
            document.body.classList.add('control-mode');
            controlPanel.classList.remove('hidden');
        }

        // Подписка на базу данных (синхро текста и времени)
        onValue(timerRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
                if (!state.labelText) state.labelText = "СТРИМ ИДЕТ";
                
                // Обновляем текст везде в реальном времени
                widgetLabel.textContent = state.labelText;
                controlLabelPreview.textContent = state.labelText;
                
                // Заполняем инпут в админке, если пользователь его прямо сейчас не редактирует
                if (!isWidget && document.activeElement !== inpLabel) {
                    inpLabel.value = state.labelText;
                }
            }
        });

        // Форматирование миллисекунд
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const pad = (num) => num.toString().padStart(2, '0');
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        // Функция запуска праздничного Glow-эффекта на виджете
        function triggerMilestoneAnimation() {
            const card = document.getElementById('widget-view');
            const text = document.getElementById('display-widget');
            
            // Сбрасываем классы анимации для перезапуска (хак с деривацией ширины offsetWidth)
            card.classList.remove('animate-milestone-card');
            text.classList.remove('animate-milestone-text');
            void card.offsetWidth; 
            void text.offsetWidth;
            
            // Навешиваем анимацию (в CSS прописано 2 повтора по 3 секунды = 6 секунд шоу)
            card.classList.add('animate-milestone-card');
            text.classList.add('animate-milestone-text');
        }

        // Главный цикл отрисовки
        function updateDisplay() {
            let currentElapsed = state.accumulated;
            
            if (state.isRunning) {
                currentElapsed += (Date.now() - state.startTime);
            }

            const formattedTime = formatTime(currentElapsed);
            
            // Вывод времени
            if (isWidget) {
                displayWidget.textContent = formattedTime;
            } else {
                displayControl.textContent = formattedTime;
            }

            // --- ТРИГГЕР АНИМАЦИИ КАЖДЫЕ 30 И 60 МИНУТ ---
            const totalSeconds = Math.floor(currentElapsed / 1000);
            
            if (state.isRunning && totalSeconds !== lastTriggeredSecond) {
                lastTriggeredSecond = totalSeconds;
                
                // Проверяем: прошло больше 0 секунд И остаток от деления на 1800 сек (30 минут) равен 0
                if (totalSeconds > 0 && totalSeconds % 1800 === 0) {
                    triggerMilestoneAnimation();
                }
            }

            requestAnimationFrame(updateDisplay);
        }
        requestAnimationFrame(updateDisplay);

        // --- ЛОГИКА АДМИН-ПАНЕЛИ ---
        if (!isWidget) {
            const btnStart = document.getElementById('btn-start');
            const btnPause = document.getElementById('btn-pause');
            const borderReset = document.getElementById('btn-reset');
            const btnSet = document.getElementById('btn-set');
            const btnSetLabel = document.getElementById('btn-set-label');
            const btnCopy = document.getElementById('btn-copy-link');

            const inpH = document.getElementById('inp-h');
            const inpM = document.getElementById('inp-m');
            const inpS = document.getElementById('inp-s');

            // Сохранение новой надписи в БД
            btnSetLabel.addEventListener('click', () => {
                const textValue = inpLabel.value.trim() || "СТРИМ ИДЕТ";
                set(timerRef, {
                    ...state,
                    labelText: textValue
                });
            });

            btnStart.addEventListener('click', () => {
                if (!state.isRunning) {
                    set(timerRef, {
                        ...state,
                        isRunning: true,
                        startTime: Date.now()
                    });
                }
            });

            btnPause.addEventListener('click', () => {
                if (state.isRunning) {
                    const newAccumulated = state.accumulated + (Date.now() - state.startTime);
                    set(timerRef, {
                        ...state,
                        isRunning: false,
                        startTime: 0,
                        accumulated: newAccumulated
                    });
                }
            });

            borderReset.addEventListener('click', () => {
                set(timerRef, {
                    ...state,
                    isRunning: false,
                    startTime: 0,
                    accumulated: 0
                });
                inpH.value = ''; inpM.value = ''; inpS.value = '';
            });

            btnSet.addEventListener('click', () => {
                const h = parseInt(inpH.value || 0) * 3600000;
                const m = parseInt(inpM.value || 0) * 60000;
                const s = parseInt(inpS.value || 0) * 1000;
                const totalMs = h + m + s;

                set(timerRef, {
                    ...state,
                    isRunning: false,
                    startTime: 0,
                    accumulated: totalMs
                });
            });

            btnCopy.addEventListener('click', async () => {
                const widgetUrl = window.location.origin + window.location.pathname + "?widget=true";
                try {
                    await navigator.clipboard.writeText(widgetUrl);
                    const originalText = btnCopy.textContent;
                    btnCopy.textContent = "УСПЕШНО СКОПИРОВАНО!";
                    btnCopy.classList.replace('bg-emerald-500', 'bg-emerald-600');
                    setTimeout(() => {
                        btnCopy.textContent = originalText;
                        btnCopy.classList.replace('bg-emerald-600', 'bg-emerald-500');
                    }, 2000);
                } catch (err) {
                    alert("Скопируй вручную: " + widgetUrl);
                }
            });
        }
    </script>
</body>
</html>

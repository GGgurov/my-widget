<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Stopwatch Widget</title>
    
    <!-- Подключаем шрифт Unbounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Unbounded', sans-serif;
            transition: background-color 0.3s;
        }

        /* Эффект Liquid Glass */
        .glass-panel {
            background: rgba(20, 20, 25, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .glow-text {
            text-shadow: 0px 0px 24px rgba(99, 102, 241, 0.8), 0px 0px 8px rgba(255, 255, 255, 0.4);
        }

        /* Режим виджета (OBS) */
        body.widget-mode {
            background: transparent !important;
        }
        body.widget-mode #control-panel {
            display: none !important;
        }
        body.control-mode #widget-view {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- ВЬЮ ВИДЖЕТА (Для OBS) -->
    <div id="widget-view" class="glass-panel rounded-[2rem] px-10 py-6 flex flex-col items-center justify-center">
        <div id="display-widget" class="text-6xl md:text-8xl font-black text-indigo-400 glow-text tracking-wider tabular-nums">
            00:00:00
        </div>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div id="control-panel" class="glass-panel rounded-3xl p-8 max-w-md w-full flex flex-col gap-8 hidden">
        <div>
            <h1 class="text-2xl font-bold text-center mb-1">Таймер стрима</h1>
            <p class="text-center text-xs text-gray-400">Синхронизация через Firebase</p>
        </div>

        <div id="display-control" class="text-5xl font-black text-center text-indigo-400 glow-text tracking-wider tabular-nums">
            00:00:00
        </div>

        <!-- Кнопки управления -->
        <div class="flex gap-3 justify-center">
            <button id="btn-start" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg shadow-indigo-600/20 text-sm">Старт</button>
            <button id="btn-pause" class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 rounded-xl font-bold transition shadow-lg shadow-amber-500/20 text-sm">Пауза</button>
            <button id="btn-reset" class="flex-1 py-3 bg-red-500 hover:bg-red-400 rounded-xl font-bold transition shadow-lg shadow-red-500/20 text-sm">Сброс</button>
        </div>

        <!-- Ручная установка времени -->
        <div class="border-t border-gray-700/50 pt-5 mt-2">
            <label class="block text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">Задать вручную (ЧЧ:ММ:СС)</label>
            <div class="flex gap-2 items-center">
                <input type="number" id="inp-h" placeholder="00" min="0" class="w-16 bg-gray-800/80 rounded-xl text-center p-2 border border-gray-600 focus:border-indigo-500 outline-none transition font-bold">
                <span class="font-bold text-gray-400">:</span>
                <input type="number" id="inp-m" placeholder="00" min="0" max="59" class="w-16 bg-gray-800/80 rounded-xl text-center p-2 border border-gray-600 focus:border-indigo-500 outline-none transition font-bold">
                <span class="font-bold text-gray-400">:</span>
                <input type="number" id="inp-s" placeholder="00" min="0" max="59" class="w-16 bg-gray-800/80 rounded-xl text-center p-2 border border-gray-600 focus:border-indigo-500 outline-none transition font-bold">
                
                <button id="btn-set" class="ml-auto px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl font-bold transition text-sm">ОК</button>
            </div>
        </div>

        <!-- Ссылка для OBS -->
        <div class="border-t border-gray-700/50 pt-5 mt-2">
            <button id="btn-copy-link" class="w-full px-4 py-3 bg-emerald-500 hover:bg-emerald-400 text-gray-900 rounded-xl font-bold transition shadow-lg shadow-emerald-500/20 flex justify-center items-center gap-2">
                Скопировать ссылку для OBS
            </button>
            <p class="text-[10px] text-gray-500 text-center mt-3">Скопируй и добавь как "Источник браузера" в OBS</p>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Твой конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDuxR5hsWmfIWrjgrsU4zVEnIVppUZxNNU",
            authDomain: "tt-widget-88711.firebaseapp.com",
            databaseURL: "https://tt-widget-88711-default-rtdb.firebaseio.com",
            projectId: "tt-widget-88711",
            storageBucket: "tt-widget-88711.firebasestorage.app",
            messagingSenderId: "997435022478",
            appId: "1:997435022478:web:a0ad462f2a7dd074d27ddf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const timerRef = ref(db, 'stream_stopwatch');

        // Локальное состояние
        let state = {
            isRunning: false,
            startTime: 0,
            accumulated: 0
        };

        // Элементы DOM
        const displayWidget = document.getElementById('display-widget');
        const displayControl = document.getElementById('display-control');
        const controlPanel = document.getElementById('control-panel');
        
        // Определение режима (Виджет или Панель)
        const urlParams = new URLSearchParams(window.location.search);
        const isWidget = urlParams.get('widget') === 'true';

        if (isWidget) {
            document.body.classList.add('widget-mode');
        } else {
            document.body.classList.add('control-mode');
            controlPanel.classList.remove('hidden');
        }

        // Подписка на изменения из базы (работает и там, и там)
        onValue(timerRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
            }
        });

        // Функция форматирования миллисекунд в ЧЧ:ММ:СС
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const pad = (num) => num.toString().padStart(2, '0');
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        // Главный цикл рендера (используем requestAnimationFrame для плавности)
        function updateDisplay() {
            let currentElapsed = state.accumulated;
            
            if (state.isRunning) {
                currentElapsed += (Date.now() - state.startTime);
            }

            const formattedTime = formatTime(currentElapsed);
            
            if (isWidget) {
                displayWidget.textContent = formattedTime;
            } else {
                displayControl.textContent = formattedTime;
            }

            requestAnimationFrame(updateDisplay);
        }
        requestAnimationFrame(updateDisplay);

        // --- ЛОГИКА ТОЛЬКО ДЛЯ ПАНЕЛИ УПРАВЛЕНИЯ ---
        if (!isWidget) {
            const btnStart = document.getElementById('btn-start');
            const btnPause = document.getElementById('btn-pause');
            const btnReset = document.getElementById('btn-reset');
            const btnSet = document.getElementById('btn-set');
            const btnCopy = document.getElementById('btn-copy-link');

            const inpH = document.getElementById('inp-h');
            const inpM = document.getElementById('inp-m');
            const inpS = document.getElementById('inp-s');

            btnStart.addEventListener('click', () => {
                if (!state.isRunning) {
                    set(timerRef, {
                        isRunning: true,
                        startTime: Date.now(),
                        accumulated: state.accumulated
                    });
                }
            });

            btnPause.addEventListener('click', () => {
                if (state.isRunning) {
                    const newAccumulated = state.accumulated + (Date.now() - state.startTime);
                    set(timerRef, {
                        isRunning: false,
                        startTime: 0,
                        accumulated: newAccumulated
                    });
                }
            });

            btnReset.addEventListener('click', () => {
                set(timerRef, {
                    isRunning: false,
                    startTime: 0,
                    accumulated: 0
                });
                inpH.value = ''; inpM.value = ''; inpS.value = '';
            });

            btnSet.addEventListener('click', () => {
                const h = parseInt(inpH.value || 0) * 3600000;
                const m = parseInt(inpM.value || 0) * 60000;
                const s = parseInt(inpS.value || 0) * 1000;
                const totalMs = h + m + s;

                set(timerRef, {
                    isRunning: false,
                    startTime: 0,
                    accumulated: totalMs
                });
            });

            btnCopy.addEventListener('click', async () => {
                const widgetUrl = window.location.origin + window.location.pathname + "?widget=true";
                try {
                    await navigator.clipboard.writeText(widgetUrl);
                    const originalText = btnCopy.textContent;
                    btnCopy.textContent = "Скопировано!";
                    btnCopy.classList.replace('bg-emerald-500', 'bg-emerald-600');
                    setTimeout(() => {
                        btnCopy.textContent = originalText;
                        btnCopy.classList.replace('bg-emerald-600', 'bg-emerald-500');
                    }, 2000);
                } catch (err) {
                    alert("Не удалось скопировать. Скопируй ссылку вручную: " + widgetUrl);
                }
            });
        }
    </script>
</body>
</html>

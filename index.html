<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        /* Общие настройки сцены */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #0a0a0c; /* Темный фон для панели управления */
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Когда включен режим стрима, делаем весь фон прозрачным */
        body.stream-mode {
            background: transparent !important;
        }

        /* Контейнер стрима 9:16 (Пропорции Tik Tok / Shorts) */
        .stream-container {
            width: 450px; /* Для превью в панели, в OBS растянется как надо */
            height: 800px;
            aspect-ratio: 9 / 16;
            position: relative;
            background: transparent;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: flex-start;
            border: 2px dashed #333; /* Граница превью, исчезнет в OBS */
        }

        body.stream-mode .stream-container {
            border: none;
            width: 100vw;
            height: 100vh;
            padding: 4vh 4vw;
        }

        /* --- ВЕРХНЯЯ РАМКА (ДЛЯ ВЕБКИ) --- */
        .webcam-frame {
            position: relative;
            width: 100%;
            height: 32%;
            border-radius: 24px;
            background: transparent; /* Полная прозрачность внутри */
            display: flex;
            align-items: flex-start;
            padding: 15px;
        }

        /* Анимированная градиентная рамка через маску */
        .webcam-frame::before, .game-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 4px; /* Толщина рамки */
            background: linear-gradient(var(--angle, 135deg), var(--color-1, #0088cc), var(--color-2, #a100ff), var(--color-3, #ff007f));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: rotateGradients var(--anim-speed, 4s) linear infinite;
        }

        /* Соцсети в углу рамки */
        .social-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .social-icons {
            display: flex;
            gap: 6px;
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        .nickname-top {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        /* --- СРЕДНЯЯ ПАНЕЛЬ (РАЗДЕЛИТЕЛЬ) --- */
        .divider-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            padding: 0 10px;
            position: relative;
        }

        .main-logo {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: 32px;
            text-transform: lowercase;
            color: rgba(255, 255, 255, 0.15); /* Полупрозрачный как на фото */
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(161, 0, 255, 0.2);
        }

        /* Анимация стрелочек (бегущие огоньки) */
        .arrows-left, .arrows-right {
            display: flex;
            gap: 4px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .arr {
            animation: arrowBlink 1.5s infinite var(--delay, 0s);
        }

        /* --- НИЖНЯЯ РАМКА (ДЛЯ ИГРЫ) --- */
        .game-frame {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Занимает все оставшееся место */
            border-radius: 24px;
            background: transparent; /* Полная прозрачность внутри */
        }

        /* АНИМАЦИИ */
        @keyframes rotateGradients {
            0% { --angle: 0deg; filter: hue-rotate(0deg); }
            100% { --angle: 360deg; filter: hue-rotate(360deg); }
        }

        @keyframes arrowBlink {
            0%, 100% { color: rgba(255, 255, 255, 0.1); text-shadow: none; }
            50% { color: var(--color-3, #ff007f); text-shadow: 0 0 8px var(--color-3, #ff007f); }
        }

        /* --- ПАНЕЛЬ УПРАВЛЕНИЯ (ДЛЯ ТЕБЯ) --- */
        .control-panel {
            position: fixed;
            left: 30px;
            top: 30px;
            background: #13131a;
            border: 1px solid #252533;
            padding: 25px;
            border-radius: 16px;
            width: 340px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        body.stream-mode .control-panel {
            display: none !important; /* Полностью скрываем в OBS */
        }

        .control-panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #a100ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            color: #8c8c9e;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .control-group input[type="text"], .control-group input[type="range"] {
            width: 100%;
            background: #1c1c24;
            border: 1px solid #2d2d3d;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-family: inherit;
        }

        .color-pickers {
            display: flex;
            gap: 10px;
        }

        .color-pickers input[type="color"] {
            flex: 1;
            height: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .btn-copy {
            width: 100%;
            background: linear-gradient(90deg, #a100ff, #ff007f);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        /* Свойство для плавной анимации градиента */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
    </style>
</head>
<body>

    <div class="control-panel" id="panel">
        <h2>Настройки Стрима</h2>
        <div class="control-group">
            <label>Твой Никнейм</label>
            <input type="text" id="nickInput" value="elgurov" oninput="updateOverlay()">
        </div>
        <div class="control-group">
            <label>Цвета Градиента (3 штуки)</label>
            <div class="color-pickers">
                <input type="color" id="col1" value="#0088cc" oninput="updateOverlay()">
                <input type="color" id="col2" value="#a100ff" oninput="updateOverlay()">
                <input type="color" id="col3" value="#ff007f" oninput="updateOverlay()">
            </div>
        </div>
        <div class="control-group">
            <label>Скорость анимации рамок</label>
            <input type="range" id="speedInput" min="1" max="10" value="4" step="0.5" oninput="updateOverlay()">
        </div>
        <button class="btn-copy" onclick="copyObsLink()">Скопировать ссылку для OBS</button>
    </div>

    <div class="stream-container">
        
        <div class="webcam-frame" id="webcam">
            <div class="social-box">
                <div class="social-icons">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-1-.65-.35-1 .22-1.62.15-.15 2.7-2.48 2.75-2.7.01-.03.01-.14-.05-.2-.06-.06-.14-.04-.2-.03-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.37.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .24z"/></svg>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                </div>
                <div class="nickname-top class-nick">elgurov</div>
            </div>
        </div>

        <div class="divider-zone">
            <div class="arrows-left">
                <span class="arr" style="--delay: 0s">▶</span>
                <span class="arr" style="--delay: 0.2s">▶</span>
                <span class="arr" style="--delay: 0.4s">▶</span>
            </div>
            
            <div class="main-logo class-nick">elgurov</div>
            
            <div class="arrows-right">
                <span class="arr" style="--delay: 0.4s">◀</span>
                <span class="arr" style="--delay: 0.2s">◀</span>
                <span class="arr" style="--delay: 0s">◀</span>
            </div>
        </div>

        <div class="game-frame" id="game"></div>

    </div>

    <script>
        // Функция динамического обновления стилей и текста
        function updateOverlay() {
            const nick = document.getElementById('nickInput').value;
            const c1 = document.getElementById('col1').value;
            const c2 = document.getElementById('col2').value;
            const c3 = document.getElementById('col3').value;
            const speed = document.getElementById('speedInput').value;

            // Применяем никнейм ко всем нужным полям
            document.querySelectorAll('.class-nick').forEach(el => {
                el.innerText = nick;
            });

            // Закидываем CSS-переменные в корневой элемент для анимаций рамок
            document.documentElement.style.setProperty('--color-1', c1);
            document.documentElement.style.setProperty('--color-2', c2);
            document.documentElement.style.setProperty('--color-3', c3);
            document.documentElement.style.setProperty('--anim-speed', speed + 's');
        }

        // Логика генерации ссылки для OBS
        function copyObsLink() {
            const nick = encodeURIComponent(document.getElementById('nickInput').value);
            const c1 = encodeURIComponent(document.getElementById('col1').value);
            const c2 = encodeURIComponent(document.getElementById('col2').value);
            const c3 = encodeURIComponent(document.getElementById('col3').value);
            const speed = document.getElementById('speedInput').value;

            // Создаем URL с параметрами
            const generatedLink = `${window.location.origin}${window.location.pathname}?stream=true&nick=${nick}&c1=${c1}&c2=${c2}&c3=${c3}&speed=${speed}`;
            
            // Копируем в буфер обмена
            navigator.clipboard.writeText(generatedLink).then(() => {
                alert('Ссылка для OBS успешно скопирована! Вставь её в источник "Браузер".');
            }).catch(err => {
                alert('Ошибка при копировании, скопируй вручную из адресной строки, добавив параметры.');
            });
        }

        // Проверяем параметры в URL при загрузке страницы
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.get('stream') === 'true') {
                // Если ссылка открыта для стрима — скрываем панель настроек и убираем фон страницы
                document.body.classList.add('stream-mode');
                
                // Считываем кастомные настройки из ссылки
                if(urlParams.get('nick')) document.getElementById('nickInput').value = urlParams.get('nick');
                if(urlParams.get('c1')) document.getElementById('col1').value = urlParams.get('c1');
                if(urlParams.get('c2')) document.getElementById('col2').value = urlParams.get('c2');
                if(urlParams.get('c3')) document.getElementById('col3').value = urlParams.get('c3');
                if(urlParams.get('speed')) document.getElementById('speedInput').value = urlParams.get('speed');
            }
            
            // Инициализируем отрисовку
            updateOverlay();
        }
    </script>
</body>
</html>
